name: 🐛 Bug Report
description: Report a bug or unexpected behavior in TorchFoundry.
title: "[BUG]: "
labels: ["bug"]
body:

* type: markdown
  attributes:
  value: |
  Thanks for reporting a bug! Please provide enough information to reproduce it.

* type: input
  id: version
  attributes:
  label: TorchFoundry version
  placeholder: "e.g. 1.0.0"
  validations:
  required: true

* type: input
  id: python
  attributes:
  label: Python version
  placeholder: "e.g. 3.12.0"
  validations:
  required: true

* type: input
  id: pytorch
  attributes:
  label: PyTorch version
  placeholder: "e.g. 2.7.0"
  validations:
  required: true

* type: textarea
  id: description
  attributes:
  label: Bug description
  description: Clearly explain what went wrong.
  validations:
  required: true

* type: textarea
  id: reproduce
  attributes:
  label: Steps to reproduce
  placeholder: |
  1. Import TorchFoundry
  2. Call the affected function
  3. Observe the error
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected behavior
  validations:
  required: true

* type: textarea
  id: actual
  attributes:
  label: Actual behavior / error output
  render: shell
  validations:
  required: true

* type: textarea
  id: additional
  attributes:
  label: Additional context
  description: Add relevant screenshots, code snippets, or other information.
  validations:
  required: false
